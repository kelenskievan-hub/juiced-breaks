<!DOCTYPE html>
<html lang="en">
<head>

<title>Juiced Breaks — Card Market Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(160deg, #020817 0%, #0a0f2e 60%, #020817 100%);
    color: #f1f5f9;
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
  input::placeholder { color: #475569; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  .wrap { max-width: 740px; margin: 0 auto; padding: 24px 16px 60px; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-icon {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, #22d3ee, #0891b2);
    border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-size: 22px; box-shadow: 0 0 24px rgba(34,211,238,.35); flex-shrink: 0;
  }
  .logo h1 { font-family: 'Bebas Neue', cursive; font-size: 24px; letter-spacing: 3px; line-height: 1; }
  .logo p { font-size: 9px; color: #22d3ee; letter-spacing: 3px; margin-top: 2px; }
  .live-badge { text-align: right; }
  .live-dot { display: flex; align-items: center; gap: 5px; justify-content: flex-end; }
  .live-dot span:first-child { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; animation: pulse 2s infinite; display: inline-block; }
  .live-dot span:last-child { font-size: 10px; color: #4ade80; font-weight: 700; letter-spacing: 1px; }
  .live-time { font-size: 9px; color: #475569; margin-top: 2px; }

  /* Nav */
  .nav { display: flex; border-bottom: 1px solid #1e293b; margin-bottom: 22px; }
  .nav-btn {
    flex: 1; padding: 11px 8px; border: none; background: transparent;
    color: #64748b; font-size: 12px; font-weight: 700; cursor: pointer;
    letter-spacing: 1px; transition: all .2s; border-bottom: 2px solid transparent;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    font-family: 'Inter', sans-serif;
  }
  .nav-btn.active { color: #22d3ee; border-bottom-color: #22d3ee; }

  /* Sport tabs */
  .sport-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 20px; }
  .sport-btn {
    padding: 8px 16px; border-radius: 20px; border: 1px solid #1e293b;
    background: rgba(255,255,255,.02); color: #64748b;
    font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
    transition: all .2s; display: flex; align-items: center; gap: 5px;
    font-family: 'Inter', sans-serif;
  }
  .sport-btn.active { border-color: #22d3ee; background: rgba(34,211,238,.1); color: #22d3ee; }

  /* Cards grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }

  /* Card */
  .card {
    background: linear-gradient(135deg, #0f172a, #141e36);
    border: 1px solid #1e3a5f; border-radius: 16px; padding: 18px;
    cursor: pointer; transition: all .2s; animation: fadeUp .35s ease both;
  }
  .card:hover { border-color: rgba(34,211,238,.35); transform: translateY(-2px); }
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .card-name { font-family: 'Bebas Neue', cursive; font-size: 17px; letter-spacing: 1.5px; color: #f1f5f9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-set { font-size: 10px; color: #64748b; line-height: 1.4; margin-top: 2px; }
  .badge { font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 6px; white-space: nowrap; flex-shrink: 0; margin-left: 8px; }
  .badge-up { background: rgba(74,222,128,.13); color: #4ade80; }
  .badge-down { background: rgba(239,68,68,.13); color: #ef4444; }
  .badge-neutral { background: rgba(148,163,184,.1); color: #94a3b8; }
  .reason { font-size: 11px; color: #f59e0b; font-style: italic; padding: 6px 10px; background: rgba(245,158,11,.06); border-radius: 6px; border-left: 2px solid rgba(245,158,11,.35); margin-bottom: 14px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .stat-box { background: #080d1a; border-radius: 8px; padding: 8px 4px; text-align: center; }
  .stat-label { font-size: 8px; color: #475569; letter-spacing: 1px; margin-bottom: 3px; }
  .stat-value { font-family: 'Bebas Neue', cursive; font-size: 16px; font-weight: 800; }
  .gem-bar { display: flex; align-items: center; gap: 6px; }
  .gem-label { font-size: 9px; color: #64748b; letter-spacing: 1px; min-width: 30px; }
  .gem-track { flex: 1; height: 4px; background: #1e293b; border-radius: 2px; overflow: hidden; }
  .gem-fill { height: 100%; border-radius: 2px; transition: width .6s ease; }
  .gem-pct { font-size: 10px; font-weight: 700; min-width: 28px; text-align: right; }
  .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .vol-badge { font-size: 10px; padding: 2px 7px; border-radius: 4px; }
  .tap-hint { font-size: 10px; color: #334155; }

  /* Spinner */
  .spinner-wrap { display: flex; flex-direction: column; align-items: center; padding: 60px 20px; gap: 14px; }
  .spinner { width: 44px; height: 44px; border: 3px solid #1e293b; border-top-color: #22d3ee; border-radius: 50%; animation: spin .8s linear infinite; }
  .spinner-text { color: #64748b; font-size: 13px; }

  /* Error */
  .error-box { text-align: center; padding: 40px 20px; }
  .error-msg { color: #ef4444; font-size: 12px; margin: 10px auto 16px; max-width: 340px; line-height: 1.5; word-break: break-word; }
  .retry-btn { padding: 10px 28px; background: #22d3ee; color: #020817; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; font-family: 'Inter', sans-serif; }

  /* Search */
  .search-wrap { position: relative; margin-bottom: 14px; }
  .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; color: #475569; pointer-events: none; }
  .search-input {
    width: 100%; padding: 12px 40px 12px 42px;
    background: #0f172a; border: 1px solid #1e3a5f;
    border-radius: 12px; color: #f1f5f9; font-size: 14px;
    outline: none; font-family: 'Inter', sans-serif; transition: border-color .2s;
  }
  .search-input:focus { border-color: #22d3ee; }
  .search-clear { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #475569; cursor: pointer; font-size: 20px; padding: 0; line-height: 1; }
  .filter-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; align-items: center; }
  .filter-label { font-size: 10px; color: #475569; letter-spacing: 1px; white-space: nowrap; }
  .filter-btn { padding: 6px 12px; border-radius: 16px; border: 1px solid #1e293b; background: rgba(255,255,255,.02); color: #64748b; font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap; font-family: 'Inter', sans-serif; transition: all .2s; }
  .filter-btn.active { border-color: #22d3ee; background: rgba(34,211,238,.1); color: #22d3ee; }
  .results-count { font-size: 11px; color: #475569; margin-bottom: 14px; letter-spacing: 1px; }
  .results-count span { color: #22d3ee; }
  .no-results { text-align: center; padding: 48px 20px; }
  .no-results-icon { font-size: 36px; margin-bottom: 12px; }
  .no-results p { color: #475569; font-size: 13px; margin-bottom: 6px; }
  .no-results small { color: #334155; font-size: 11px; }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.85);
    z-index: 200; display: flex; align-items: center; justify-content: center;
    padding: 16px; backdrop-filter: blur(6px);
  }
  .modal {
    background: linear-gradient(135deg, #0f172a, #1a2744);
    border: 1px solid #334155; border-radius: 20px; padding: 24px;
    width: 100%; max-width: 500px; max-height: 88vh; overflow-y: auto;
    position: relative;
  }
  .modal-close {
    position: absolute; top: 14px; right: 14px;
    background: #1e293b; border: 1px solid #334155; color: #94a3b8;

  renderSearchResults(results, q);

  // Also try live search
  try {
    const res = await fetch(`${API}?action=search&query=${encodeURIComponent(searchQuery)}`);
    const json = await res.json();
    // Live results would be merged here in a future update
  } catch(e) {}
}

function renderSearchResults(results, q) {
  const el = document.getElementById('search-content');
  const countEl = `<div class="results-count">${results.length} CARD${results.length!==1?'S':''} FOUND${q?` · <span>"${q}"</span>`:''}`;
  if (!results.length) {
    el.innerHTML = q ? `${countEl}<div class="no-results"><div class="no-results-icon">🔎</div><p>No cards found for "${q}"</p><small>Try a player name, set name, or card type</small></div>` : '';
    return;
  }
  el.innerHTML = countEl + renderGrid(results);
}

function setFilter(f, btn) {
  searchFilter = f;
  document.querySelectorAll('.filter-row:nth-child(2) .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (searchQuery) runSearch();
}

function setSort(s, btn) {
  searchSort = s;
  document.querySelectorAll('.filter-row:nth-child(3) .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (searchQuery) runSearch();
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-btn').forEach((b, i) => b.classList.toggle('active', (tab==='trending'&&i===0)||(tab==='search'&&i===1)));
  document.getElementById('tab-trending').style.display = tab === 'trending' ? '' : 'none';
  document.getElementById('tab-search').style.display = tab === 'search' ? '' : 'none';
}

function openModal(card) {
  const detail = DETAIL_DATA[card.player] || {
    gradingVerdict: (card.psa10Price / card.rawPrice) > 3 ? 'Worth grading' : 'Skip grading',
    verdictReason: (card.psa10Price / card.rawPrice) > 3 ? 'Strong PSA 10 premium justifies grading cost.' : 'Slim margin after grading fees — sell raw.',
    popReport: { psa10: Math.floor(card.psa10Price * 0.4), psa9: Math.floor(card.psa10Price * 0.7), total: Math.floor(card.psa10Price * 1.8) },
    recentSales: [
      {date:'May 8',grade:'PSA 10',price:card.psa10Price,platform:'eBay'},
      {date:'May 7',grade:'Raw',price:card.rawPrice,platform:'eBay'},
      {date:'May 6',grade:'PSA 9',price:Math.round(card.psa10Price*0.55),platform:'eBay'},
      {date:'May 5',grade:'Raw',price:Math.round(card.rawPrice*0.95),platform:'Whatnot'},
      {date:'May 3',grade:'PSA 10',price:Math.round(card.psa10Price*0.96),platform:'eBay'},
    ],
    priceHistory: [
      {month:'Nov',raw:Math.round(card.rawPrice*.55),psa10:Math.round(card.psa10Price*.55)},
      {month:'Dec',raw:Math.round(card.rawPrice*.65),psa10:Math.round(card.psa10Price*.65)},
      {month:'Jan',raw:Math.round(card.rawPrice*.74),psa10:Math.round(card.psa10Price*.74)},
      {month:'Feb',raw:Math.round(card.rawPrice*.83),psa10:Math.round(card.psa10Price*.83)},
      {month:'Mar',raw:Math.round(card.rawPrice*.90),psa10:Math.round(card.psa10Price*.90)},
      {month:'Apr',raw:Math.round(card.rawPrice*.96),psa10:Math.round(card.psa10Price*.96)},
      {month:'May',raw:card.rawPrice,psa10:card.psa10Price},
    ],
  };

  const raw = detail.recentSales.find(s=>s.grade==='Raw')?.price ?? card.rawPrice;
  const p10 = detail.recentSales.find(s=>s.grade==='PSA 10')?.price ?? card.psa10Price;
  const net = p10 - raw - 28;
  const isWorth = detail.gradingVerdict === 'Worth grading';
  const gc = gemColor(card.gemRate);
  const sport = card.sport;
  const icon = {NBA:'🏀',NFL:'🏈',MLB:'⚾',Pokemon:'⚡'}[sport]||'🃏';

  const salesHTML = detail.recentSales.map(s => `
    <div class="sale-row">
      <span class="sale-date">${s.date}</span>
      <span class="sale-grade" style="color:${gradeColor(s.grade)}">${s.grade}</span>
      <span class="sale-price">$${s.price}</span>
      <span class="sale-platform">${s.platform}</span>
    </div>`).join('');

  // SVG chart
  const h = detail.priceHistory;
  const W=280,H=70,P=10;
  const vals = h.flatMap(d=>[d.raw,d.psa10]);
  const mn=Math.min(...vals),mx=Math.max(...vals);
  const sx=i=>P+(i/(h.length-1))*(W-P*2);
  const sy=v=>H-P-((v-mn)/((mx-mn)||1))*(H-P*2);
  const line=k=>h.map((d,i)=>`${i===0?'M':'L'}${sx(i).toFixed(1)},${sy(d[k]).toFixed(1)}`).join(' ');
  const dots=k=>h.map((d,i)=>`<circle cx="${sx(i).toFixed(1)}" cy="${sy(d[k]).toFixed(1)}" r="3" fill="${k==='raw'?'#f59e0b':'#22d3ee'}"/>`).join('');
  const labels=h.map((d,i)=>`<text x="${sx(i).toFixed(1)}" y="${H+14}" text-anchor="middle" font-size="8" fill="#475569">${d.month}</text>`).join('');

  document.getElementById('modal-inner').innerHTML = `
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal-title"><span>${icon}</span><h2>${card.player}</h2></div>
    <div class="modal-sub">${card.card}</div>
    <div class="modal-stats">
      <div class="stat-box"><div class="stat-label">RAW</div><div class="stat-value" style="color:#f59e0b">$${raw}</div></div>
      <div class="stat-box"><div class="stat-label">PSA 10</div><div class="stat-value" style="color:#22d3ee">$${p10}</div></div>
      <div class="stat-box"><div class="stat-label">FLIP NET</div><div class="stat-value" style="color:${net>0?'#4ade80':'#ef4444'}">${net>0?'+$'+net:'LOSS'}</div></div>
    </div>
    <div class="verdict-box" style="background:${isWorth?'rgba(34,211,238,.07)':'rgba(239,68,68,.07)'};border:1px solid ${isWorth?'rgba(34,211,238,.2)':'rgba(239,68,68,.2)'}">
      <div class="verdict-header">
        <span class="verdict-title" style="color:${isWorth?'#22d3ee':'#ef4444'}">${isWorth?'✓ WORTH GRADING':'✗ SKIP GRADING'}</span>
        <span class="verdict-gem">Gem: ${card.gemRate}%</span>
      </div>
      <div class="verdict-reason">${detail.verdictReason}</div>
      <div class="pop-row">
        <span>Pop 10: <strong style="color:#22d3ee">${detail.popReport.psa10}</strong></span>
        <span>Pop 9: <strong style="color:#a78bfa">${detail.popReport.psa9}</strong></span>
        <span>Total: <strong style="color:#94a3b8">${detail.popReport.total}</strong></span>
      </div>
    </div>
    <div class="section-title">RECENT SALES</div>
    <div class="sales-list">${salesHTML}</div>
    <div class="section-title">6-MONTH PRICE TREND</div>
    <div class="chart-legend">
      <div class="legend-item"><div class="legend-line" style="background:#f59e0b"></div><span class="legend-text">Raw</span></div>
      <div class="legend-item"><div class="legend-line" style="background:#22d3ee"></div><span class="legend-text">PSA 10</span></div>
    </div>
    <svg width="${W}" height="${H+16}" style="overflow:visible">
      ${labels}
      <path d="${line('raw')}" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
      <path d="${line('psa10')}" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
      ${dots('raw')}${dots('psa10')}
    </svg>`;

  document.getElementById('modal').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal')) return;
  document.getElementById('modal').style.display = 'none';
  document.body.style.overflow = '';
}
